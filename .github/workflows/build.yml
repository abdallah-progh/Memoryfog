name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          mkdir -p extracted
          unzip -o "$ZIPFILE" -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Locate project directory
        id: findproj
        run: |
          SETTINGS_PATH=$(find extracted -name "settings.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build with system Gradle
        working-directory: ${{ steps.findproj.outputs.project_dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.findproj.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
