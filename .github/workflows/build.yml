name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          mkdir -p extracted
          unzip -o "$ZIPFILE" -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate gradlew
        id: findgradle
        run: |
          GRADLEW_PATH=$(find extracted -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Grant execute permission
        run: chmod +x ${{ steps.findgradle.outputs.project_dir }}/gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.findgradle.outputs.project_dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.findgradle.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
